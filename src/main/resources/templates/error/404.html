<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
    <title>Error 404</title>
</head>

<body>

<div layout:fragment="content">

    <section class="d-flex align-items-center justify-content-center py-5"
             style="min-height: calc(100vh - 160px);">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-7">

                    <div class="card border-0 shadow-lg text-center overflow-hidden">

                        <!-- TOP -->
                        <div class="card-header border-0 py-4"
                             style="background:var(--acero); border-bottom:5px solid var(--rojo)!important;">

                            <div class="display-1 fw-bold oswald mb-0"
                                 style="color:var(--rojo); letter-spacing:4px;">

                                404

                            </div>

                            <p class="text-light text-uppercase small mb-0"
                               style="letter-spacing:3px;">

                                Página no encontrada

                            </p>

                        </div>

                        <!-- BODY -->
                        <div class="card-body p-5">

                            <div class="mb-4">

                                <div class="rounded-circle d-inline-flex align-items-center justify-content-center"
                                     style="width:90px;height:90px;background:var(--rojo);">

                                    <i class="bi bi-exclamation-triangle-fill text-white fs-1"></i>

                                </div>

                            </div>

                            <h1 class="oswald mb-3"
                                style="color:var(--acero);">

                                ESTA RUTA SE PERDIÓ EN EL ALMACÉN

                            </h1>

                            <p class="text-muted fs-5 mb-4">

                                No pudimos encontrar esta página :/

                            </p>

                            <div class="d-flex flex-wrap justify-content-center gap-3">

                                <a th:href="@{/}"
                                   class="btn btn-rojo px-4 py-2">

                                    <i class="bi bi-house me-2"></i>
                                    VOLVER AL INICIO

                                </a>

                                <a th:href="@{/productos}"
                                   class="btn btn-outline-secondary px-4 py-2">

                                    <i class="bi bi-box-seam me-2"></i>
                                    VER INVENTARIO

                                </a>

                            </div>

                        </div>

                        <!-- FOOT -->
                        <div class="card-footer bg-white border-0 pb-4">

                            <small class="text-muted">

                                <i class="bi bi-shield-check text-success me-1"></i>
                                FERREVOZ · Sistema operativo correctamente

                            </small>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

</div>

</body>
</html>
